workflows:
  ios-release:
    name: iOS Release Build
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: oddiro_asc_key   # Codemagicに既存の連携(ODDIROで使用したもの)をそのまま利用
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.yutaXXX.countrycode
      vars:
        XCODE_PROJECT: "ios/App/App.xcodeproj"
        XCODE_SCHEME: "App"
        BUNDLE_ID: "com.yutaXXX.countrycode"
      node: 22
      xcode: latest
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: master
          include: true
    scripts:
      - name: Install npm dependencies
        script: |
          npm install --omit=dev
      - name: Sync Capacitor iOS project
        script: |
          npx cap sync ios
      - name: Set up code signing (App Store Connect API連携)
        script: |
          xcode-project use-profiles
      - name: Increment build number
        script: |
          cd $CM_BUILD_DIR/ios/App
          agvtool new-version -all $(($(app-store-connect get-latest-testflight-build-number "$BUNDLE_ID") + 1))
      - name: Build .ipa
        script: |
          xcode-project build-ipa \
            --project "$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration   # Codemagic上でApp Store Connect Integrationを設定して使う
        submit_to_testflight: true
        submit_to_app_store: false   # 最初はTestFlightのみ。審査提出は動作確認後に手動でtrueにする
